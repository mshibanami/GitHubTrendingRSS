name: Website preview

on:
  pull_request:
    paths:
      - "website/**"
      - "scripts/prepare_website_local.sh"
      - "scripts/generate_website_manifest.mjs"
      - "scripts/generate_website_entry_counts.mjs"
      - ".github/workflows/website_preview.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install Website Dependencies
        working-directory: website
        run: corepack pnpm install --frozen-lockfile

      - name: Check Website Formatting
        working-directory: website
        run: corepack pnpm format:check

      - name: Generate Local Website Data
        working-directory: website
        run: corepack pnpm prepare:generated

      - name: Check Website
        working-directory: website
        run: corepack pnpm check

      - name: Build Website
        env:
          VITE_BASE_PATH: /GitHubTrendingRSS/
        working-directory: website
        run: corepack pnpm build

      - name: Upload Website Preview
        id: upload-preview
        uses: actions/upload-artifact@v7
        with:
          name: website-preview-pr-${{ github.event.pull_request.number }}
          path: website/dist
          if-no-files-found: error
          retention-days: 7

      - name: Add Preview Artifact Link to Summary
        env:
          ARTIFACT_URL: ${{ steps.upload-preview.outputs.artifact-url }}
        run: |
          echo "Website preview artifact: ${ARTIFACT_URL}" >> "$GITHUB_STEP_SUMMARY"
