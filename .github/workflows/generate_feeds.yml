name: Fetch and Generate RSS Feeds

on:
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [repos, developers]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Install librsvg
        run: brew install librsvg
      - name: Convert icons to PNG
        run: ./scripts/convert_icons_to_png.sh
      - name: Build and Fetch Feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build.sh --target ${{ matrix.target }}
      - name: Package Output
        run: tar -czf output-${{ matrix.target }}.tar.gz output
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: output-${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error

  deploy:
    needs: fetch
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: output-*.tar.gz
          merge-multiple: true
          path: artifacts/
      - name: Extract Artifacts
        run: |
          tar -xzf artifacts/output-repos.tar.gz
          tar -xzf artifacts/output-developers.tar.gz
      - name: Validate generated RSS feeds
        run: ./scripts/validate_feeds.sh
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy.sh
